<div class="flex items-center justify-between mb-3">
    <h2 class="font-display text-lg">{{ title }}</h2>
    <button type="button"
            onclick="document.getElementById('export-dialog').close()"
            class="text-ink/50 hover:text-ink text-2xl leading-none">&times;</button>
</div>
{% if text %}
<textarea readonly rows="12" id="export-text"
          style="font-family: 'Twemoji Country Flags', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;"
          class="w-full text-sm bg-ink/5 rounded-md p-3 resize-none focus:outline-none">{{ text }}</textarea>
<button type="button"
        class="mt-3 w-full bg-pitch hover:bg-pitch-dark text-white font-medium py-2 rounded-md transition-colors"
        onclick="navigator.clipboard.writeText(document.getElementById('export-text').value); this.textContent = 'Copied!'; setTimeout(() => this.textContent = 'Copy to clipboard', 1500);">
    Copy to clipboard
</button>
<button type="button"
        class="mt-2 w-full bg-ink hover:bg-ink-light text-paper font-medium py-2 rounded-md transition-colors"
        onclick="generateExportImage(this, '{{ title }}')">
    Generate image
</button>
<div id="export-image-preview"></div>
<script type="application/json" id="export-team-rows">{{ rows_json|safe }}</script>
{% else %}
<p class="text-sm text-ink/60">{{ empty_message }}</p>
{% endif %}
